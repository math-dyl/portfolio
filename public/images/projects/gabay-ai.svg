<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1000" height="650" rx="0" fill="#eaf0e7" stroke="none"/><rect x="74" y="62" width="852" height="526" rx="9" fill="#fff" stroke="#dde2eb"/><rect x="74" y="62" width="852" height="37" rx="9" fill="#f9fafc" stroke="none"/><rect x="74" y="87" width="852" height="12" rx="0" fill="#f9fafc" stroke="none"/><circle cx="96" cy="81" r="4" fill="#e3e6ed"/><circle cx="112" cy="81" r="4" fill="#e3e6ed"/><circle cx="128" cy="81" r="4" fill="#e3e6ed"/><text x="455" y="85" font-size="10" fill="#8c94a2" font-weight="400">gabay.ai / community</text><path d="M74 99H926" stroke="#e5e8ec"/><rect x="74" y="99" width="181" height="489" rx="0" fill="#f7f9f6" stroke="none"/><rect x="96" y="119" width="26" height="26" rx="7" fill="#467962" stroke="none"/><text x="103" y="138" font-size="19" fill="#fff" font-weight="700">g</text><text x="133" y="138" font-size="17" fill="#29483b" font-weight="700">GABAY</text><text x="96" y="187" font-size="10" fill="#85958c" font-weight="400">Your community guide</text><rect x="89" y="209" width="152" height="34" rx="5" fill="#e7eee6" stroke="none"/><text x="104" y="231" font-size="11" fill="#47745b" font-weight="600">+  New conversation</text><text x="96" y="281" font-size="8" fill="#85958c" font-weight="700">EXPLORE SERVICES</text><text x="104" y="318" font-size="11" fill="#647e6c" font-weight="400">Documents &amp; permits</text><text x="104" y="356" font-size="11" fill="#647e6c" font-weight="400">Health &amp; assistance</text><text x="104" y="394" font-size="11" fill="#647e6c" font-weight="400">Community resources</text><text x="96" y="549" font-size="9" fill="#85958c" font-weight="400">Information for everyone.</text><text x="282" y="134" font-size="12" fill="#506554" font-weight="600">Community assistant</text><text x="821" y="134" font-size="9" fill="#6c8a6c" font-weight="400">●  Online</text><path d="M255 153H926" stroke="#e5e8ec"/><rect x="478" y="184" width="409" height="46" rx="7" fill="#eaf0e8" stroke="none"/><text x="497" y="212" font-size="13" fill="#45664e" font-weight="400">How do I get a barangay clearance?</text><rect x="282" y="262" width="31" height="31" rx="8" fill="#477962" stroke="none"/><text x="291" y="284" font-size="21" fill="#fff" font-weight="700">g</text><text x="326" y="280" font-size="10" fill="#51715c" font-weight="700">GABAY AI</text><text x="326" y="312" font-size="18" fill="#304f3c" font-weight="600">I can help you with that.</text><text x="326" y="340" font-size="11" fill="#788b7d" font-weight="400">Here’s a starting point for requesting your clearance:</text><rect x="326" y="357" width="541" height="115" rx="6" fill="#f6f8f3" stroke="none"/><text x="345" y="386" font-size="12" fill="#4c6654" font-weight="600">01   Prepare your identification</text><text x="345" y="416" font-size="12" fill="#4c6654" font-weight="600">02   Visit your barangay service desk</text><text x="345" y="446" font-size="12" fill="#4c6654" font-weight="600">03   Confirm requirements with the local office</text><text x="326" y="494" font-size="9" fill="#899c8b" font-weight="400">Illustrative answer · verify with your local office</text><rect x="282" y="523" width="605" height="40" rx="6" fill="#fff" stroke="#dde5db"/><text x="299" y="548" font-size="11" fill="#9da89d" font-weight="400">Ask about a community service…</text><rect x="852" y="530" width="26" height="26" rx="5" fill="#477962" stroke="none"/><text x="859" y="549" font-size="17" fill="#fff" font-weight="400">↑</text></g></svg>